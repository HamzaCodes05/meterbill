services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meterbill
      POSTGRES_PASSWORD: meterbill
      POSTGRES_DB: meterbill
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterbill"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://meterbill:meterbill@db:5432/meterbill
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
