name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: meterbill, POSTGRES_PASSWORD: meterbill, POSTGRES_DB: meterbill }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meterbill" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: ci-secret
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Start API
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null localhost:4000/v1/customers && break; sleep 1; done
      - name: End-to-end billing flow (independent pricing oracle)
        working-directory: .
        run: python3 scripts/smoke.py
      - name: Race: ingestion vs finalization must never lose or double-bill usage
        working-directory: .
        run: python3 scripts/race.py --trials 10
      - if: failure()
        run: cat api.log

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm run build
